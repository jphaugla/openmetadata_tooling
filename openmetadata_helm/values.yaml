# values.yaml
# OpenMetadata Helm Values
# Configured for PostgreSQL backend and bundled OpenSearch

openmetadata:
  config:
    database:
      host: openmetadata-postgres
      port: 5432
      driverClass: org.postgresql.Driver
      dbScheme: postgresql
      databaseName: openmetadata_db
      auth:
        username: postgres
        password:
          secretRef: postgresql-secrets
          secretKey: openmetadata-postgresql-password
    elasticsearch:
      enabled: true
      host: opensearch
      searchType: opensearch
      port: 9200
      scheme: http
    pipelineServiceClientConfig:
      enabled: true
      type: "k8s"
      metadataApiEndpoint: http://openmetadata:8585/api
      k8s:
        ingestionImage: docker.getcollate.io/openmetadata/ingestion-base:1.12.1
        imagePullPolicy: Always
        useOMJobOperator: false
